name: "Local OpenCode runner"
description: "Install and run OpenCode with Node24-compatible dependencies"

inputs:
  version:
    description: "Pinned OpenCode version"
    required: false
    default: "1.4.7"
  model:
    description: "Model to use"
    required: true
  prompt:
    description: "Prompt to send to OpenCode"
    required: false
  use_github_token:
    description: "Use GITHUB_TOKEN directly"
    required: false
    default: "false"
  share:
    description: "Share the OpenCode session"
    required: false
  mentions:
    description: "Comma-separated trigger phrases"
    required: false
  variant:
    description: "Provider-specific model variant"
    required: false
  agent:
    description: "Primary agent to use"
    required: false
  oidc_base_url:
    description: "Custom OIDC exchange base URL"
    required: false

runs:
  using: "composite"
  steps:
    - name: Cache OpenCode
      id: cache
      uses: actions/cache@v5
      with:
        path: ~/.opencode/bin
        key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Install OpenCode
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        OPENCODE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) archive="opencode-linux-x64.tar.gz" ;;
          Linux-ARM64) archive="opencode-linux-arm64.tar.gz" ;;
          macOS-X64) archive="opencode-darwin-x64.zip" ;;
          macOS-ARM64) archive="opencode-darwin-arm64.zip" ;;
          *)
            echo "Unsupported runner: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac

        install_dir="$HOME/.opencode/bin"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT

        mkdir -p "$install_dir"

        url="https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/${archive}"
        curl -fsSL "$url" -o "$tmp_dir/$archive"

        case "$archive" in
          *.tar.gz) tar -xzf "$tmp_dir/$archive" -C "$tmp_dir" ;;
          *.zip) unzip -q "$tmp_dir/$archive" -d "$tmp_dir" ;;
        esac

        install -m 755 "$tmp_dir/opencode" "$install_dir/opencode"

    - name: Add OpenCode to PATH
      shell: bash
      run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

    - name: Run OpenCode
      shell: bash
      run: opencode github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
