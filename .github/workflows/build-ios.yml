name: iOS 빌드 및 TestFlight 업로드

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/ios/native-app/**'
      - 'mobile/ios/native/**'
      - 'app/assets/hololive_ocg.sqlite'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    name: iOS IPA 빌드 및 TestFlight 업로드
    runs-on: macos-latest
    
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      
      - name: Secrets 확인
        id: check_secrets
        run: |
          if [ -z "${{ secrets.IOS_TEAM_ID }}" ] || [ -z "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" ]; then
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "⚠️ iOS Secrets가 설정되지 않았습니다. .github/SECRETS_SETUP.md를 참고하세요."
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Xcode 버전 확인
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: xcodebuild -version
      
      - name: 빌드 번호 설정
        if: steps.check_secrets.outputs.has_secrets == 'true'
        id: build_number
        run: |
          # project.yml에서 CURRENT_PROJECT_VERSION 읽기
          BASE_BUILD_NUMBER=$(grep "CURRENT_PROJECT_VERSION:" mobile/ios/native-app/project.yml | awk '{print $2}')
          
          if [ -z "$BASE_BUILD_NUMBER" ]; then
            echo "❌ 에러: project.yml에서 CURRENT_PROJECT_VERSION을 찾을 수 없습니다"
            exit 1
          fi
          
          # GitHub run_number를 더해 최종 빌드 번호 생성
          BUILD_NUMBER=$((BASE_BUILD_NUMBER + ${{ github.run_number }}))
          
          echo "✅ 베이스 빌드 번호: $BASE_BUILD_NUMBER"
          echo "✅ GitHub run_number: ${{ github.run_number }}"
          echo "✅ 최종 빌드 번호: $BUILD_NUMBER"
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
      
      - name: App Store Connect API 키 설정
        if: steps.check_secrets.outputs.has_secrets == 'true'
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          
          # App Store Connect API 인증 설정
          xcrun notarytool store-credentials "AC_PASSWORD" \
            --key ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            --key-id ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --issuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} || true
      
      - name: Archive 빌드
        if: steps.check_secrets.outputs.has_secrets == 'true'
        working-directory: mobile/ios/native-app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild \
            -project HocgNative.xcodeproj \
            -scheme HocgNative \
            -configuration Release \
            -archivePath build/HocgNative.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=${{ steps.build_number.outputs.build_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
            -authenticationKeyID ${APP_STORE_CONNECT_KEY_ID} \
            -authenticationKeyIssuerID ${APP_STORE_CONNECT_ISSUER_ID} \
            archive
      
      - name: ExportOptions.plist 생성
        if: steps.check_secrets.outputs.has_secrets == 'true'
        working-directory: mobile/ios/native-app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${DEVELOPMENT_TEAM}</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF
      
      - name: IPA Export
        if: steps.check_secrets.outputs.has_secrets == 'true'
        working-directory: mobile/ios/native-app
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/HocgNative.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
            -authenticationKeyID ${APP_STORE_CONNECT_KEY_ID} \
            -authenticationKeyIssuerID ${APP_STORE_CONNECT_ISSUER_ID}
      
      - name: TestFlight 업로드
        if: steps.check_secrets.outputs.has_secrets == 'true'
        working-directory: mobile/ios/native-app
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/ipa/*.ipa \
            --apiKey $APP_STORE_CONNECT_KEY_ID \
            --apiIssuer $APP_STORE_CONNECT_ISSUER_ID
      
      - name: IPA 아티팩트 업로드
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: mobile/ios/native-app/build/ipa/*.ipa
          retention-days: 30
