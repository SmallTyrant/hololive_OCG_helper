name: Swarm Minimal (native-app full auto)

on:
  workflow_dispatch:
    inputs:
      run:
        description: "Workflow mode"
        type: choice
        required: true
        default: run-agent
        options:
          - run-agent
          - bootstrap-labels
      prompt:
        description: "Agent prompt (run-agent mode)"
        required: false
        default: "Analyze current context and create the required PR changes."
      model:
        description: "OpenCode model"
        required: false
        default: "anthropic/claude-sonnet-4-20250514"
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: swarm-min-${{ github.event.pull_request.number || github.event.issue.number || github.sha }}
  cancel-in-progress: false

jobs:

  # ============================================================
  # 0) BOOTSTRAP LABELS (manual run once from Actions tab)
  # ============================================================

  bootstrap_labels:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'bootstrap-labels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const labels = [
              { name: "scope:android", color: "0E8A16", description: "Android runtime scope" },
              { name: "scope:ios", color: "0E8A16", description: "iOS runtime scope" },
              { name: "scope:tools", color: "0E8A16", description: "Python/tools scope" },
              { name: "scope:builder", color: "0E8A16", description: "Build/CI/native-app scope" },
              { name: "go", color: "5319E7", description: "Trigger OpenCode agent" },
              { name: "tests-passed", color: "2ECC71", description: "CI passed" },
              { name: "tests-failed", color: "E74C3C", description: "CI failed" },
              { name: "fix-attempted", color: "F39C12", description: "Auto fix already attempted" },
              { name: "blocked", color: "000000", description: "Manual intervention required" }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } catch (e) {}
            }

  # ============================================================
  # 0-1) OPENCODE RUN (manual dispatch)
  # ============================================================

  opencode_dispatch:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'run-agent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          model: ${{ github.event.inputs.model }}
          use_github_token: true
          prompt: |
            ${{ github.event.inputs.prompt }}

  # ============================================================
  # 1) OPENCODE RUN (Issue label = go)  → Claude 1회
  # ============================================================

  opencode_go:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'go') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'go') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/go'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          model: anthropic/claude-sonnet-4-20250514
          use_github_token: true
          prompt: |
            Create PR(s) for this request.

            HARD SCOPE by labels:
            - scope:android -> mobile/android/native/**
            - scope:ios -> mobile/ios/native/**
            - scope:tools -> app/** tools/** *.py pyproject.toml requirements*.txt
            - scope:builder -> mobile/android/native-app/** mobile/ios/native-app/** .github/workflows/** scripts/**

            Rules:
            - Edit ONLY within selected scope.
            - No dependency/signing/Gradle wrapper/AGP changes.
            - Never bundle data/hololive_ocg.sqlite into mobile builds.
            - PR body must include: Closes #<issue>, Summary, Files, How to test.

  # ============================================================
  # 2) CHANGE DETECTION
  # ============================================================

  changes:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
      tools: ${{ steps.filter.outputs.tools }}
      builder: ${{ steps.filter.outputs.builder }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'mobile/ios/native/**'
            android:
              - 'mobile/android/native/**'
            tools:
              - 'app/**'
              - 'tools/**'
              - '**/*.py'
              - 'pyproject.toml'
              - 'requirements*.txt'
            builder:
              - '.github/workflows/**'
              - 'scripts/**'
              - 'mobile/android/native-app/**'
              - 'mobile/ios/native-app/**'

  # ============================================================
  # 3) GATES (no LLM)
  # ============================================================

  scope_guard:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Fail on mixed scopes
        run: |
          C=0
          [ "${{ needs.changes.outputs.ios }}" = "true" ] && C=$((C+1))
          [ "${{ needs.changes.outputs.android }}" = "true" ] && C=$((C+1))
          [ "${{ needs.changes.outputs.tools }}" = "true" ] && C=$((C+1))
          [ "${{ needs.changes.outputs.builder }}" = "true" ] && C=$((C+1))
          if [ "$C" -gt 1 ]; then
            echo "Mixed scopes detected."
            exit 1
          fi

  db_bundle_guard:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block sqlite usage
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.sqlite$' ; then exit 1; fi
          if git diff origin/${{ github.base_ref }}...HEAD -- | grep -Ei 'hololive_ocg\.sqlite' ; then exit 1; fi

  secrets_scan:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2

  # ============================================================
  # 4) TESTS
  # ============================================================

  android:
    needs: [changes, scope_guard, db_bundle_guard, secrets_scan]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android/native-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          chmod +x ./gradlew
          ./gradlew test

  tools:
    needs: [changes, scope_guard, db_bundle_guard, secrets_scan]
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -U pip
          python -m compileall tools app

  # ============================================================
  # 5) VERDICT LABELING
  # ============================================================

  verdict:
    needs: [changes, scope_guard, db_bundle_guard, secrets_scan, android, tools]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const needs = ${{ toJson(needs) }};

            const gatesOk =
              needs.scope_guard.result === "success" &&
              needs.db_bundle_guard.result === "success" &&
              needs.secrets_scan.result === "success";

            const testsOk =
              (needs.android?.result === "success" || needs.android?.result === "skipped") &&
              (needs.tools?.result === "success" || needs.tools?.result === "skipped");

            const allOk = gatesOk && testsOk;

            async function remove(name){
              try { await github.rest.issues.removeLabel({owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, name}); } catch(e){}
            }

            await remove("tests-passed");
            await remove("tests-failed");

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [allOk ? "tests-passed" : "tests-failed"]
            });

  # ============================================================
  # 6) AUTO MERGE
  # ============================================================

  auto_merge:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'tests-passed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.draft) return;
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: "squash"
            });

  # ============================================================
  # 7) FIX ONCE (Claude 최대 1회 추가)
  # ============================================================

  fix_once:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'tests-failed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        id: guard
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = pr.labels.map(l => l.name);
            core.setOutput("attempted", labels.includes("fix-attempted") ? "true" : "false");

      - uses: actions/github-script@v7
        if: steps.guard.outputs.attempted == 'true'
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ["blocked"]
            });

      - uses: anomalyco/opencode/github@latest
        if: steps.guard.outputs.attempted != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          model: anthropic/claude-sonnet-4-20250514
          use_github_token: true
          prompt: |
            FIX MODE (single attempt).
            Only fix failing CI checks with minimal change.
            Do not change deps/signing/Gradle/AGP.
            Never bundle data/hololive_ocg.sqlite.
