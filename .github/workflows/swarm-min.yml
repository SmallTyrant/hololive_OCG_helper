name: Swarm Minimal (native-app full auto)

env:
  DEFAULT_MODEL: "openai/gpt-5.3-codex"
  OPENCODE_VERSION: "1.4.7"

on:
  workflow_dispatch:
    inputs:
      run:
        description: "Workflow mode"
        type: choice
        required: true
        default: run-agent
        options:
          - run-agent
          - bootstrap-labels
      prompt:
        description: "Agent prompt (run-agent mode)"
        required: false
        default: "Analyze current context and create the required PR changes."
      model:
        description: "OpenCode model"
        required: false
        default: "openai/gpt-5.3-codex"
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: swarm-min-${{ github.event.pull_request.number || github.event.issue.number || github.sha }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # 0) BOOTSTRAP LABELS (manual run once from Actions tab)
  # ============================================================

  bootstrap_labels:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'bootstrap-labels'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const labels = [
              { name: "scope:android", color: "0E8A16", description: "Android runtime scope" },
              { name: "scope:ios", color: "0E8A16", description: "iOS runtime scope" },
              { name: "scope:db", color: "0E8A16", description: "Bundled DB scope" },
              { name: "scope:tools", color: "0E8A16", description: "Python/tools/app scope" },
              { name: "scope:builder", color: "0E8A16", description: "Workflow/action scope" },
              { name: "go", color: "5319E7", description: "Trigger OpenCode agent" },
              { name: "tests-passed", color: "2ECC71", description: "CI passed" },
              { name: "tests-failed", color: "E74C3C", description: "CI failed" },
              { name: "fix-attempted", color: "F39C12", description: "Auto fix already attempted" },
              { name: "blocked", color: "000000", description: "Manual intervention required" }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } catch (e) {
                if (e.status !== 422) console.warn(`Label "${label.name}" error:`, e.message);
              }
            }

  # ============================================================
  # 0-1) OPENCODE RUN (manual dispatch)
  # ============================================================

  opencode_dispatch:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run == 'run-agent'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/opencode-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          version: ${{ env.OPENCODE_VERSION }}
          model: ${{ github.event.inputs.model }}
          use_github_token: true
          prompt: |
            ${{ github.event.inputs.prompt }}

  # ============================================================
  # 1) OPENCODE RUN (Issue label = go)
  # ============================================================

  opencode_go:
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'go') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'go') ||
      (github.event_name == 'issue_comment' &&
        startsWith(github.event.comment.body, '/go') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/opencode-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          version: ${{ env.OPENCODE_VERSION }}
          model: ${{ env.DEFAULT_MODEL }}
          use_github_token: true
          prompt: |
            Create PR(s) for this request.

            HARD SCOPE by labels:
            - scope:android -> mobile/android/native/** mobile/android/native-app/**
            - scope:ios -> mobile/ios/native/** mobile/ios/native-app/**
            - scope:db -> app/assets/hololive_ocg.sqlite
            - scope:tools -> app/** tools/** scripts/** *.py pyproject.toml requirements*.txt
            - scope:builder -> .github/workflows/** .github/actions/**

            Rules:
            - Edit ONLY within selected scope.
            - No dependency/signing/Gradle wrapper/AGP changes.
            - Never bundle data/hololive_ocg.sqlite into mobile builds.
            - PR body must include: Closes #<issue>, Summary, Files, How to test.

  # ============================================================
  # 2) CHANGE DETECTION
  # ============================================================

  changes:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      scope: ${{ steps.detect.outputs.scope }}
      android: ${{ steps.detect.outputs.android }}
      ios: ${{ steps.detect.outputs.ios }}
      db: ${{ steps.detect.outputs.db }}
      tools: ${{ steps.detect.outputs.tools }}
      builder: ${{ steps.detect.outputs.builder }}
      mixed: ${{ steps.detect.outputs.mixed }}
      none: ${{ steps.detect.outputs.none }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect canonical scope
        id: detect
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | python3 scripts/ci/detect_scope.py --github-output "$GITHUB_OUTPUT" --verbose

  # ============================================================
  # 3) GATES (no LLM)
  # ============================================================

  scope_guard:
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail on mixed scopes
        run: |
          echo "Detected scope: ${{ needs.changes.outputs.scope }}"
          if [ "${{ needs.changes.outputs.scope }}" = "mixed" ]; then
            echo "Mixed scopes detected."
            exit 1
          fi

  db_bundle_guard:
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Allow DB-only sqlite changes and block mixed sqlite usage
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED_FILES="$(git diff --name-only origin/${{ github.base_ref }}...HEAD)"
          SQLITE_FILES="$(printf '%s\n' "$CHANGED_FILES" | grep -E '\.sqlite$' || true)"

          if [ "${{ needs.changes.outputs.scope }}" = "db" ]; then
            if [ "$CHANGED_FILES" != "app/assets/hololive_ocg.sqlite" ]; then
              echo "DB scope must only change app/assets/hololive_ocg.sqlite"
              printf '%s\n' "$CHANGED_FILES"
              exit 1
            fi
            exit 0
          fi

          if [ -n "$SQLITE_FILES" ]; then
            echo "SQLite file changes are only allowed in db scope:"
            printf '%s\n' "$SQLITE_FILES"
            exit 1
          fi

  secrets_scan:
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install Gitleaks
        run: |
          VERSION="8.30.1"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Run Gitleaks
        run: gitleaks detect --source . --redact --no-banner

  # ============================================================
  # 4) TESTS
  # ============================================================

  android:
    needs: [changes, scope_guard, db_bundle_guard, secrets_scan]
    if: needs.changes.outputs.scope == 'android'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile/android/native-app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          chmod +x ./gradlew
          ./gradlew test

  ios:
    needs: [changes, scope_guard, db_bundle_guard, secrets_scan]
    if: needs.changes.outputs.scope == 'ios'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 scripts/mobile_build_gate.py --target ios

  db:
    needs: [changes, scope_guard, db_bundle_guard, secrets_scan]
    if: needs.changes.outputs.scope == 'db'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 tools/test_db_download.py
      - run: python3 tools/test_db_download_integration.py

  tools:
    needs: [changes, scope_guard, db_bundle_guard, secrets_scan]
    if: needs.changes.outputs.scope == 'tools'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: |
          python -m pip install -U pip
          python -m compileall tools app

  builder:
    needs: [changes, scope_guard, db_bundle_guard, secrets_scan]
    if: needs.changes.outputs.scope == 'builder'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Parse workflow and action YAML
        run: |
          ruby - <<'RUBY'
          require "yaml"
          paths = Dir[".github/workflows/*.{yml,yaml}"] + Dir[".github/actions/**/action.{yml,yaml}"]
          abort("No workflow/action YAML files found") if paths.empty?
          paths.each do |path|
            YAML.load_file(path)
            puts "OK #{path}"
          end
          RUBY

  # ============================================================
  # 5) VERDICT LABELING
  # ============================================================

  verdict:
    needs: [changes, scope_guard, db_bundle_guard, secrets_scan, android, ios, db, tools, builder]
    if: github.event_name == 'pull_request' && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const needs = ${{ toJson(needs) }};

            const gatesOk =
              (needs.scope_guard.result === "success" || needs.scope_guard.result === "skipped") &&
              (needs.db_bundle_guard.result === "success" || needs.db_bundle_guard.result === "skipped") &&
              (needs.secrets_scan.result === "success" || needs.secrets_scan.result === "skipped");

            const testsOk =
              (needs.android?.result === "success" || needs.android?.result === "skipped") &&
              (needs.ios?.result === "success" || needs.ios?.result === "skipped") &&
              (needs.db?.result === "success" || needs.db?.result === "skipped") &&
              (needs.tools?.result === "success" || needs.tools?.result === "skipped") &&
              (needs.builder?.result === "success" || needs.builder?.result === "skipped");

            const allOk = gatesOk && testsOk;

            async function remove(name){
              try { await github.rest.issues.removeLabel({owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, name}); } catch(e){}
            }

            await remove("tests-passed");
            await remove("tests-failed");

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [allOk ? "tests-passed" : "tests-failed"]
            });

  # ============================================================
  # 6) AUTO MERGE
  # ============================================================

  auto_merge:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'tests-passed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.draft) return;
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: "squash"
            });

  # ============================================================
  # 7) FIX ONCE (최대 1회 추가)
  # ============================================================

  fix_once:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'tests-failed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/github-script@v8
        id: guard
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = pr.labels.map(l => l.name);
            core.setOutput("attempted", labels.includes("fix-attempted") ? "true" : "false");

      - uses: actions/github-script@v8
        if: steps.guard.outputs.attempted == 'true'
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ["blocked"]
            });

      - uses: ./.github/actions/opencode-run
        if: steps.guard.outputs.attempted != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          version: ${{ env.OPENCODE_VERSION }}
          model: ${{ env.DEFAULT_MODEL }}
          use_github_token: true
          prompt: |
            FIX MODE (single attempt).
            Only fix failing CI checks with minimal change.
            Do not change deps/signing/Gradle/AGP.
            Never bundle data/hololive_ocg.sqlite.

      - uses: actions/github-script@v8
        if: steps.guard.outputs.attempted != 'true'
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ["fix-attempted"]
            });
