name: Android 빌드 및 GitHub Release 업로드

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/android/native-app/**'
      - 'mobile/android/native/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Android APK 빌드 및 GitHub Release 업로드
    runs-on: ubuntu-latest
    
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      
      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: 빌드 번호 설정
        id: build_number
        run: |
          BASE_BUILD_NUMBER=136
          BUILD_NUMBER=$((BASE_BUILD_NUMBER + ${{ github.run_number }}))
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "version_name=1.2.13" >> $GITHUB_OUTPUT
      
      - name: keystore.properties 생성 (Release 빌드용)
        working-directory: mobile/android/native-app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            KEYSTORE_PATH="$(pwd)/hocg-release-new.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            cat > keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            echo "키스토어 시크릿이 없습니다. Debug APK만 빌드합니다."
          fi
      
      - name: Gradlew 실행 권한 부여
        working-directory: mobile/android/native-app
        run: chmod +x ./gradlew
      
      - name: Release APK 빌드
        working-directory: mobile/android/native-app
        env:
          VERSION_CODE: ${{ steps.build_number.outputs.build_number }}
          VERSION_NAME: ${{ steps.build_number.outputs.version_name }}
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew assembleRelease --no-daemon -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
            echo "apk_path=$APK_PATH" >> $GITHUB_ENV
            echo "apk_name=hololive-ocg-helper-v${{ steps.build_number.outputs.version_name }}-build${{ steps.build_number.outputs.build_number }}.apk" >> $GITHUB_ENV
          else
            ./gradlew assembleDebug --no-daemon -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
            echo "apk_path=$APK_PATH" >> $GITHUB_ENV
            echo "apk_name=hololive-ocg-helper-v${{ steps.build_number.outputs.version_name }}-build${{ steps.build_number.outputs.build_number }}-debug.apk" >> $GITHUB_ENV
          fi
      
      - name: APK 파일 확인 및 이름 변경
        working-directory: mobile/android/native-app
        run: |
          ls -lh ${{ env.apk_path }}
          echo "APK 크기: $(du -h ${{ env.apk_path }} | cut -f1)"
          cp ${{ env.apk_path }} ${{ env.apk_name }}
          cp ${{ env.apk_path }} android-latest.apk
          echo "renamed_apk=mobile/android/native-app/${{ env.apk_name }}" >> $GITHUB_ENV
          echo "latest_apk=mobile/android/native-app/android-latest.apk" >> $GITHUB_ENV
      
      - name: 태그 이름 설정
        id: create_tag
        run: |
          TAG_NAME="android-v${{ steps.build_number.outputs.version_name }}-build${{ steps.build_number.outputs.build_number }}"
          RELEASE_NAME="Android v${{ steps.build_number.outputs.version_name }} (build ${{ steps.build_number.outputs.build_number }})"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT

      - name: 릴리즈 노트 로드
        id: release_notes
        run: |
          NOTES_FILE=".github/release-notes/android/${{ steps.build_number.outputs.version_name }}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "❌ 릴리즈 노트 파일이 없습니다: $NOTES_FILE"
            echo "버전이 올라갈 때마다 .github/release-notes/android/<version>.md 파일을 추가하세요."
            exit 1
          fi

          echo "notes_path=$NOTES_FILE" >> $GITHUB_OUTPUT
          {
            echo "body<<EOF"
            cat "$NOTES_FILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      
      - name: GitHub Release 생성 및 APK 업로드
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.create_tag.outputs.tag_name }}
          name: ${{ steps.create_tag.outputs.release_name }}
          body: |
            ## Android APK 빌드
            
            **빌드 번호**: ${{ steps.build_number.outputs.build_number }}
            **버전**: ${{ steps.build_number.outputs.version_name }}
            **커밋**: ${{ github.sha }}
            
            ### 변경사항
            ${{ steps.release_notes.outputs.body }}
            
            ### 설치 방법
            1. APK 파일을 Android 기기에 다운로드
            2. 설치 허용 (출처를 알 수 없는 앱 설치 허용 필요)
            3. 앱 실행
          files: |
            ${{ env.renamed_apk }}
            ${{ env.latest_apk }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 릴리즈 자산 업로드 검증 및 요약
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${{ steps.create_tag.outputs.tag_name }}"
          ASSET_NAME="${{ env.apk_name }}"
          LATEST_ASSET_NAME="android-latest.apk"

          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          RELEASE_URL="$(echo "$RELEASE_JSON" | jq -r '.html_url')"
          APK_URL="$(echo "$RELEASE_JSON" | jq -r --arg n "$ASSET_NAME" '.assets[] | select(.name == $n) | .browser_download_url')"
          LATEST_URL="$(echo "$RELEASE_JSON" | jq -r --arg n "$LATEST_ASSET_NAME" '.assets[] | select(.name == $n) | .browser_download_url')"

          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "❌ 릴리즈에 빌드 APK가 업로드되지 않았습니다: $ASSET_NAME"
            exit 1
          fi

          if [ -z "$LATEST_URL" ] || [ "$LATEST_URL" = "null" ]; then
            echo "❌ 릴리즈에 최신 APK가 업로드되지 않았습니다: $LATEST_ASSET_NAME"
            exit 1
          fi

          {
            echo "## Android Release 결과"
            echo ""
            echo "- 태그: \\`$TAG\\`"
            echo "- 릴리즈: $RELEASE_URL"
            echo "- 빌드 APK: [$ASSET_NAME]($APK_URL)"
            echo "- 최신 APK: [$LATEST_ASSET_NAME]($LATEST_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: APK 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_number }}
          path: |
            ${{ env.renamed_apk }}
            ${{ env.latest_apk }}
          retention-days: 30
