name: Android 빌드 및 GitHub Release 업로드

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/android/native-app/**'
      - 'mobile/android/native/**'
      - '.github/release-notes/android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Android signed APK 빌드 및 버전별 릴리즈 생성
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 버전 정보 로드
        id: version
        working-directory: mobile/android/native-app
        run: |
          set -euo pipefail
          VERSION_NAME="$(jq -r '.versionName' version.json)"
          VERSION_CODE="$(jq -r '.versionCode' version.json)"
          APK_URL="$(jq -r '.apkUrl' version.json)"

          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ versionName은 X.Y.Z 형식이어야 합니다: $VERSION_NAME"
            exit 1
          fi
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -le 0 ]; then
            echo "❌ version.json의 versionCode가 올바르지 않습니다: $VERSION_CODE"
            exit 1
          fi
          if [ "$APK_URL" != "https://github.com/SmallTyrant/hololive_OCG_helper/releases/download/install_file1/app-release.apk" ]; then
            echo "❌ version.json apkUrl은 install_file1/app-release.apk 고정 URL이어야 합니다: $APK_URL"
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "release_tag=android-v${VERSION_NAME}-build${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: 버전별 릴리즈 노트 확인
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          NOTES_FILE=".github/release-notes/android/${VERSION_NAME}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "❌ 릴리즈 노트 파일이 없습니다: $NOTES_FILE"
            exit 1
          fi

      - name: Android 서명 시크릿 확인
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "❌ Android 릴리즈는 반드시 현재 배포 인증서로 서명해야 합니다."
            echo "ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 시크릿을 확인하세요."
            exit 1
          fi

      - name: keystore.properties 생성
        working-directory: mobile/android/native-app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$(pwd)/hocg-release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          {
            echo "storeFile=$KEYSTORE_PATH"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Gradlew 실행 권한 부여
        working-directory: mobile/android/native-app
        run: chmod +x ./gradlew

      - name: Release APK 빌드
        working-directory: mobile/android/native-app
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile/android/native-app/hocg-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew clean :app:assembleRelease --no-daemon -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: APK 서명 인증서 검증
        working-directory: mobile/android/native-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          KEYSTORE_PATH="$(pwd)/hocg-release.jks"

          KEYSTORE_CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | awk 'BEGIN{IGNORECASE=1} /SHA256:/{sub(/^.*SHA256:[[:space:]]*/, ""); gsub(/[[:space:]:]/, ""); print toupper($0); exit}')"
          if [ -z "$KEYSTORE_CERT_SHA256" ]; then
            echo "❌ GitHub Secret 키스토어 인증서 지문을 읽지 못했습니다."
            exit 1
          fi

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "❌ apksigner를 찾지 못했습니다."
            exit 1
          fi

          APK_CERT_SHA256="$($APKSIGNER verify --verbose --print-certs "$APK_PATH" | awk 'BEGIN{IGNORECASE=1} /SHA-256/ && /digest:/{sub(/^.*digest:[[:space:]]*/, ""); gsub(/[[:space:]:]/, ""); print toupper($0); exit}')"
          if [ -z "$APK_CERT_SHA256" ]; then
            echo "❌ APK 서명 인증서 지문을 읽지 못했습니다."
            exit 1
          fi

          if [ "$APK_CERT_SHA256" != "$KEYSTORE_CERT_SHA256" ]; then
            echo "❌ APK 서명 인증서가 GitHub Secret 키스토어 인증서와 다릅니다."
            exit 1
          fi

          echo "✅ APK 서명 인증서가 GitHub Secret 키스토어 인증서와 일치합니다."

      - name: 릴리즈 업로드 파일 준비
        working-directory: mobile/android/native-app
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "❌ Release APK가 생성되지 않았습니다: $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" app-release.apk
          mkdir -p release-archive
          APK_SHA256="$(sha256sum app-release.apk | awk '{print $1}')"
          jq --arg tag "$RELEASE_TAG" --arg repo "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" --arg checksum "$APK_SHA256" \
            '.tag = $tag | .apkUrl = ("https://github.com/" + $repo + "/releases/download/" + $tag + "/app-release.apk") | .sourceCommit = $commit | .apkSha256 = $checksum' \
            version.json > release-archive/version.json
          ls -lh app-release.apk release-archive/version.json
          echo "apk_path=mobile/android/native-app/app-release.apk" >> "$GITHUB_ENV"
          echo "version_json_path=mobile/android/native-app/version.json" >> "$GITHUB_ENV"

      - name: 버전별 Android 릴리즈 게시
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          NOTES_FILE=".github/release-notes/android/${VERSION_NAME}.md"
          TITLE="Android v${VERSION_NAME} (build ${VERSION_CODE})"
          ARCHIVE_JSON="mobile/android/native-app/release-archive/version.json"

          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > release-state.json; then
            if [ "$(jq -r '.isDraft' release-state.json)" = "false" ]; then
              # A successful rerun reuses the published files, preserving history.
              DOWNLOAD_DIR="$(mktemp -d)"
              gh release download "$RELEASE_TAG" --pattern app-release.apk --pattern version.json --dir "$DOWNLOAD_DIR"
              if ! jq -e --arg commit "$GITHUB_SHA" --arg version "$VERSION_NAME" --argjson code "$VERSION_CODE" \
                '.sourceCommit == $commit and .versionName == $version and .versionCode == $code' \
                "$DOWNLOAD_DIR/version.json" >/dev/null; then
                echo "❌ 이 버전/빌드는 이미 다른 소스로 공개됐습니다. versionName 또는 versionCode를 올려 주세요."
                exit 1
              fi
              EXPECTED_SHA256="$(jq -r '.apkSha256' "$DOWNLOAD_DIR/version.json")"
              ACTUAL_SHA256="$(sha256sum "$DOWNLOAD_DIR/app-release.apk" | awk '{print $1}')"
              if [ "$EXPECTED_SHA256" != "$ACTUAL_SHA256" ]; then
                echo "❌ 기존 릴리즈 APK의 체크섬이 일치하지 않습니다."
                exit 1
              fi
              cp "$DOWNLOAD_DIR/app-release.apk" "$apk_path"
              cp "$DOWNLOAD_DIR/version.json" "$ARCHIVE_JSON"
              echo "✅ 이미 게시된 버전별 릴리즈를 재사용합니다: $RELEASE_TAG"
            else
              if [ "$(jq -r '.targetCommitish' release-state.json)" != "$GITHUB_SHA" ]; then
                echo "❌ 같은 버전/빌드의 초안이 다른 커밋에 연결되어 있습니다."
                exit 1
              fi
              gh release upload "$RELEASE_TAG" "$apk_path" "$ARCHIVE_JSON" --clobber
              gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
            fi
          else
            gh release create "$RELEASE_TAG" \
              "$apk_path" "$ARCHIVE_JSON" \
              --target "$GITHUB_SHA" \
              --latest \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
          fi

          # Compatibility metadata keeps the fixed URL used by installed apps.
          jq --arg repo "$GITHUB_REPOSITORY" \
            '.tag = "install_file1" | .apkUrl = ("https://github.com/" + $repo + "/releases/download/install_file1/app-release.apk")' \
            "$ARCHIVE_JSON" > "$version_json_path"

      - name: install_file1 릴리즈 준비
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES_FILE=".github/release-notes/android/${{ steps.version.outputs.version_name }}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "❌ 릴리즈 노트 파일이 없습니다: $NOTES_FILE"
            echo "버전이 올라갈 때마다 .github/release-notes/android/<version>.md 파일을 추가하세요."
            exit 1
          fi

          if gh release view install_file1 >/dev/null 2>&1; then
            gh release edit install_file1 \
              --draft=false \
              --prerelease=false \
              --latest=false \
              --title "Android 설치 파일 (최신 업데이트용)" \
              --notes-file "$NOTES_FILE"
          else
            gh release create install_file1 \
              --latest=false \
              --target "$GITHUB_SHA" \
              --title "Android 설치 파일 (최신 업데이트용)" \
              --notes-file "$NOTES_FILE"
          fi

      - name: 기존 릴리즈 자산 정리
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/install_file1" \
            --jq '.assets[] | select(.name != "app-release.apk" and .name != "version.json") | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r asset_id asset_name; do
            [ -n "$asset_id" ] || continue
            echo "Deleting stale release asset: $asset_name"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done

      - name: 단일 APK 및 version.json 업로드
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload install_file1 \
            "${{ env.apk_path }}" \
            "${{ env.version_json_path }}" \
            --clobber

      - name: 릴리즈 자산 검증 및 요약
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/install_file1")"
          RELEASE_URL="$(echo "$RELEASE_JSON" | jq -r '.html_url')"
          APK_COUNT="$(echo "$RELEASE_JSON" | jq '[.assets[] | select(.name | endswith(".apk"))] | length')"
          APK_URL="$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "app-release.apk") | .browser_download_url')"
          VERSION_JSON_URL="$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "version.json") | .browser_download_url')"

          if [ "$APK_COUNT" != "1" ]; then
            echo "❌ install_file1 릴리즈에는 APK가 1개만 있어야 합니다. 현재: $APK_COUNT"
            exit 1
          fi
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "❌ app-release.apk 업로드 검증 실패"
            exit 1
          fi
          if [ -z "$VERSION_JSON_URL" ] || [ "$VERSION_JSON_URL" = "null" ]; then
            echo "❌ version.json 업로드 검증 실패"
            exit 1
          fi

          ARCHIVE_RELEASE="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          ARCHIVE_URL="$(echo "$ARCHIVE_RELEASE" | jq -r '.html_url')"
          ARCHIVE_APK_URL="$(echo "$ARCHIVE_RELEASE" | jq -r '.assets[] | select(.name == "app-release.apk") | .browser_download_url')"
          if ! echo "$ARCHIVE_RELEASE" | jq -e \
            '(.draft == false) and (.prerelease == false) and ([.assets[] | select(.name == "app-release.apk")] | length == 1) and ([.assets[] | select(.name == "version.json")] | length == 1)' >/dev/null; then
            echo "❌ 버전별 릴리즈 검증 실패: $RELEASE_TAG"
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --latest

          {
            echo "## Android Release 결과"
            echo ""
            echo "- 태그: $RELEASE_TAG"
            echo "- 버전별 릴리즈: $ARCHIVE_URL"
            echo "- 보관 APK: [app-release.apk]($ARCHIVE_APK_URL)"
            echo "- 최신 업데이트용 릴리즈: $RELEASE_URL"
            echo "- 고정 APK 주소: [app-release.apk]($APK_URL)"
            echo "- 업데이트 정보: [version.json]($VERSION_JSON_URL)"
            echo "- versionName: ${{ steps.version.outputs.version_name }}"
            echo "- versionCode: ${{ steps.version.outputs.version_code }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-${{ steps.version.outputs.version_code }}
          path: |
            ${{ env.apk_path }}
            ${{ env.version_json_path }}
          retention-days: 30
