name: Android 빌드 및 GitHub Release 업로드

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/android/native-app/**'
      - 'mobile/android/native/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Android signed APK 빌드 및 install_file1 릴리즈 갱신
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 버전 정보 로드
        id: version
        working-directory: mobile/android/native-app
        run: |
          set -euo pipefail
          VERSION_NAME="$(jq -r '.versionName' version.json)"
          VERSION_CODE="$(jq -r '.versionCode' version.json)"
          APK_URL="$(jq -r '.apkUrl' version.json)"

          if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "null" ]; then
            echo "❌ version.json에 versionName이 없습니다."
            exit 1
          fi
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -le 0 ]; then
            echo "❌ version.json의 versionCode가 올바르지 않습니다: $VERSION_CODE"
            exit 1
          fi
          if [ "$APK_URL" != "https://github.com/SmallTyrant/hololive_OCG_helper/releases/download/install_file1/app-release.apk" ]; then
            echo "❌ version.json apkUrl은 install_file1/app-release.apk 고정 URL이어야 합니다: $APK_URL"
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"

      - name: Android 서명 시크릿 확인
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "❌ Android 릴리즈는 반드시 현재 배포 인증서로 서명해야 합니다."
            echo "ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 시크릿을 확인하세요."
            exit 1
          fi

      - name: keystore.properties 생성
        working-directory: mobile/android/native-app
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$(pwd)/hocg-release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          {
            echo "storeFile=$KEYSTORE_PATH"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Gradlew 실행 권한 부여
        working-directory: mobile/android/native-app
        run: chmod +x ./gradlew

      - name: Release APK 빌드
        working-directory: mobile/android/native-app
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile/android/native-app/hocg-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew clean :app:assembleRelease --no-daemon -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: APK 서명 인증서 검증
        working-directory: mobile/android/native-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          KEYSTORE_PATH="$(pwd)/hocg-release.jks"

          KEYSTORE_CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | awk 'BEGIN{IGNORECASE=1} /SHA256:/{sub(/^.*SHA256:[[:space:]]*/, ""); gsub(/[[:space:]:]/, ""); print toupper($0); exit}')"
          if [ -z "$KEYSTORE_CERT_SHA256" ]; then
            echo "❌ GitHub Secret 키스토어 인증서 지문을 읽지 못했습니다."
            exit 1
          fi

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "❌ apksigner를 찾지 못했습니다."
            exit 1
          fi

          APK_CERT_SHA256="$($APKSIGNER verify --verbose --print-certs "$APK_PATH" | awk 'BEGIN{IGNORECASE=1} /SHA-256/ && /digest:/{sub(/^.*digest:[[:space:]]*/, ""); gsub(/[[:space:]:]/, ""); print toupper($0); exit}')"
          if [ -z "$APK_CERT_SHA256" ]; then
            echo "❌ APK 서명 인증서 지문을 읽지 못했습니다."
            exit 1
          fi

          if [ "$APK_CERT_SHA256" != "$KEYSTORE_CERT_SHA256" ]; then
            echo "❌ APK 서명 인증서가 GitHub Secret 키스토어 인증서와 다릅니다."
            exit 1
          fi

          echo "✅ APK 서명 인증서가 GitHub Secret 키스토어 인증서와 일치합니다."

      - name: 릴리즈 업로드 파일 준비
        working-directory: mobile/android/native-app
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "❌ Release APK가 생성되지 않았습니다: $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" app-release.apk
          jq '.tag = "install_file1" | .apkUrl = "https://github.com/SmallTyrant/hololive_OCG_helper/releases/download/install_file1/app-release.apk"' version.json > version.release.json
          mv version.release.json version.json
          ls -lh app-release.apk version.json
          echo "apk_path=mobile/android/native-app/app-release.apk" >> "$GITHUB_ENV"
          echo "version_json_path=mobile/android/native-app/version.json" >> "$GITHUB_ENV"

      - name: install_file1 릴리즈 준비
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view install_file1 >/dev/null 2>&1; then
            gh release edit install_file1 \
              --title "Android 설치 파일" \
              --notes "현재 Android 배포 인증서로 서명된 최신 APK 1개만 유지합니다. DB는 앱에 번들하지 않고 DB 릴리즈에서 다운로드합니다."
          else
            gh release create install_file1 \
              --title "Android 설치 파일" \
              --notes "현재 Android 배포 인증서로 서명된 최신 APK 1개만 유지합니다. DB는 앱에 번들하지 않고 DB 릴리즈에서 다운로드합니다."
          fi

      - name: 기존 릴리즈 자산 정리
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/install_file1" \
            --jq '.assets[] | select(.name != "app-release.apk" and .name != "version.json") | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r asset_id asset_name; do
            [ -n "$asset_id" ] || continue
            echo "Deleting stale release asset: $asset_name"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done

      - name: 단일 APK 및 version.json 업로드
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload install_file1 \
            "${{ env.apk_path }}" \
            "${{ env.version_json_path }}" \
            --clobber

      - name: 릴리즈 자산 검증 및 요약
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/install_file1")"
          RELEASE_URL="$(echo "$RELEASE_JSON" | jq -r '.html_url')"
          APK_COUNT="$(echo "$RELEASE_JSON" | jq '[.assets[] | select(.name | endswith(".apk"))] | length')"
          APK_URL="$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "app-release.apk") | .browser_download_url')"
          VERSION_JSON_URL="$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "version.json") | .browser_download_url')"

          if [ "$APK_COUNT" != "1" ]; then
            echo "❌ install_file1 릴리즈에는 APK가 1개만 있어야 합니다. 현재: $APK_COUNT"
            exit 1
          fi
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "❌ app-release.apk 업로드 검증 실패"
            exit 1
          fi
          if [ -z "$VERSION_JSON_URL" ] || [ "$VERSION_JSON_URL" = "null" ]; then
            echo "❌ version.json 업로드 검증 실패"
            exit 1
          fi

          {
            echo "## Android Release 결과"
            echo ""
            echo "- 태그: \`install_file1\`"
            echo "- 릴리즈: $RELEASE_URL"
            echo "- APK: [app-release.apk]($APK_URL)"
            echo "- version.json: [version.json]($VERSION_JSON_URL)"
            echo "- versionName: ${{ steps.version.outputs.version_name }}"
            echo "- versionCode: ${{ steps.version.outputs.version_code }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-${{ steps.version.outputs.version_code }}
          path: |
            ${{ env.apk_path }}
            ${{ env.version_json_path }}
          retention-days: 30
